[package]
name = "nexus"
version = "0.1.0"
edition = "2024"

[dependencies]
rusqlite = { version = "0.39.0", features = ["bundled", "chrono"] }
clap = { version = "4.6.1", features = ["derive", "env"] }
clap-markdown = "0.1.5"
colored = "3.0.0"
chrono = { version = "0.4.44", features = ["serde"] }
rand = "0.10.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
gix = "0.81.0"
